<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Michelin Aktie</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: transparent;
      color: #000;
    }

    .stock-card {
      box-sizing: border-box;
      width: 100%;
      padding: 18px;
      border-radius: 14px;
      background: #ffffff;
      border-left: 8px solid #fedd00;
    }

    .headline {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 18px;
      color: #162e7b;
    }

    .row {
      margin-bottom: 14px;
    }

    .label {
      font-size: 12px;
      color: #666;
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .value {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.1;
    }

    .positive {
      color: #16803c;
    }

    .negative {
      color: #c62828;
    }

    .footer {
      margin-top: 10px;
      font-size: 11px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="stock-card">

    <div class="headline">
      Michelin Aktie
    </div>

    <div class="row">
      <div class="label">Aktueller Kurs</div>
      <div class="value" id="price">Lädt…</div>
    </div>

    <div class="row">
      <div class="label">Veränderung absolut</div>
      <div class="value" id="changeEuro">Lädt…</div>
    </div>

    <div class="row">
      <div class="label">Veränderung in Prozent</div>
      <div class="value" id="changePercent">Lädt…</div>
    </div>

    <div class="footer" id="time">
      Quelle: Yahoo Finance
    </div>

  </div>

  <script>

    async function loadStock() {

      try {

    const response = await fetch(
    "https://api.allorigins.win/raw?url=https://query1.finance.yahoo.com/v8/finance/chart/ML.PA"
    );

        const data = await response.json();

        const meta = data.chart.result[0].meta;

        const price = meta.regularMarketPrice;
        const previousClose = meta.previousClose;

        const diff = price - previousClose;
        const percent = (diff / previousClose) * 100;

        const positive = diff >= 0;

        const cls = positive
          ? "positive"
          : "negative";

        document.getElementById("price").innerText =
          price.toFixed(2) + " EUR";

        document.getElementById("changeEuro").innerText =
          (positive ? "+" : "") +
          diff.toFixed(2) +
          " EUR";

        document.getElementById("changePercent").innerText =
          (positive ? "+" : "") +
          percent.toFixed(2) +
          "%";

        document.getElementById("changeEuro").className =
          "value " + cls;

        document.getElementById("changePercent").className =
          "value " + cls;

        const now = new Date();

        document.getElementById("time").innerText =
          "Letzte Aktualisierung: " +
          now.toLocaleTimeString("de-DE");

      } catch (error) {

        document.getElementById("price").innerText =
          "Keine Daten";

        console.error(error);

      }

    }

    loadStock();

    setInterval(loadStock, 60000);

  </script>

</body>
</html>
